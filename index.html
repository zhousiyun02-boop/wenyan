<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f6f5c">
<link rel="apple-touch-icon" href="icon-192.png">
<title>文言实词 · 背词卡</title>
<style>
  :root{
    --bg:#faf6ee; --card:#ffffff; --ink:#2b2b2b; --sub:#8a8a7a;
    --green:#1f6f5c; --green-soft:#e3efe9; --red:#c05a3f; --red-soft:#f7e6df;
    --yellow:#b8860b; --yellow-soft:#f5edda; --line:#e8e0d0;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    max-width:520px; margin:0 auto; padding-bottom:64px; user-select:none;
  }
  header{
    padding:18px 18px 10px; display:flex; align-items:baseline; justify-content:space-between;
  }
  header h1{font-size:20px; font-weight:700; letter-spacing:1px}
  header h1 small{font-size:12px; color:var(--sub); font-weight:400; margin-left:6px}
  header .date{font-size:12px; color:var(--sub)}
  .stats{
    display:flex; margin:0 18px 12px; background:var(--card); border-radius:14px;
    box-shadow:0 2px 8px rgba(60,50,30,.06); overflow:hidden;
  }
  .stats div{flex:1; text-align:center; padding:10px 4px}
  .stats b{display:block; font-size:20px; color:var(--green)}
  .stats span{font-size:11px; color:var(--sub)}
  .stats div+div{border-left:1px solid var(--line)}
  /* 卡片 */
  #study{display:block}
  .card-area{display:flex; flex-direction:column; align-items:center; padding:6px 18px 0}
  .card{
    width:100%; min-height:300px; background:var(--card); border-radius:22px;
    box-shadow:0 6px 20px rgba(60,50,30,.08); padding:28px 22px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    border:1px solid var(--line); position:relative;
  }
  .card .tag{
    position:absolute; top:14px; left:16px; font-size:11px; color:var(--sub);
    background:var(--bg); border-radius:20px; padding:3px 10px;
  }
  .card .word{
    font-family:"Kaiti SC","STKaiti","KaiTi",serif; font-size:68px; font-weight:700;
    letter-spacing:6px; color:var(--ink); margin:10px 0 4px;
  }
  .card .py{font-size:14px; color:var(--sub); letter-spacing:2px; margin-bottom:14px}
  .card .mean{
    display:none; width:100%; background:var(--green-soft); border-radius:14px;
    padding:16px 18px; font-size:16px; line-height:1.9; color:#22463b;
  }
  .card .mean p{margin-bottom:8px}
  .card .mean p:last-child{margin-bottom:0}
  .card .mean b{color:var(--green)}
  .hint{font-size:13px; color:var(--sub); margin:12px 0 0; text-align:center}
  .btns{display:none; width:100%; gap:10px; margin-top:16px}
  .btns button{
    flex:1; border:none; border-radius:14px; padding:14px 0; font-size:16px; font-weight:600;
    cursor:pointer; transition:transform .05s;
  }
  .btns button:active{transform:scale(.96)}
  .b-no{background:var(--red-soft); color:var(--red)}
  .b-mid{background:var(--yellow-soft); color:var(--yellow)}
  .b-yes{background:var(--green-soft); color:var(--green)}
  .btn-flip{
    width:100%; margin-top:16px; background:var(--green); color:#fff; border:none;
    border-radius:14px; padding:15px 0; font-size:17px; font-weight:600; cursor:pointer;
  }
  .btn-flip:active{opacity:.85}
  .done{
    text-align:center; padding:60px 20px; display:none;
  }
  .done .big{font-size:52px; margin-bottom:12px}
  .done h2{font-size:20px; margin-bottom:8px}
  .done p{color:var(--sub); font-size:14px; margin-bottom:24px}
  .done button{
    background:var(--green); color:#fff; border:none; border-radius:14px;
    padding:13px 26px; font-size:15px; font-weight:600; cursor:pointer; margin:6px;
  }
  .done button.ghost{background:var(--card); color:var(--green); border:1px solid var(--green)}
  /* 词表 */
  #list{display:none; padding:6px 18px 0}
  #list .search{
    width:100%; padding:11px 16px; border-radius:12px; border:1px solid var(--line);
    background:var(--card); font-size:15px; outline:none; margin-bottom:12px;
  }
  .w-item{
    background:var(--card); border-radius:14px; padding:12px 16px; margin-bottom:8px;
    border:1px solid var(--line); cursor:pointer;
  }
  .w-item .top{display:flex; align-items:center; gap:10px}
  .w-item .w{font-family:"Kaiti SC","KaiTi",serif; font-size:22px; font-weight:700}
  .w-item .py{font-size:12px; color:var(--sub)}
  .w-item .first{font-size:13px; color:var(--sub); margin-top:4px; line-height:1.6}
  .w-item .detail{display:none; font-size:14px; line-height:1.9; margin-top:8px;
    background:var(--bg); border-radius:10px; padding:10px 12px; color:#444}
  .w-item .detail p{margin-bottom:6px}
  .w-item .detail p:last-child{margin-bottom:0}
  .dot{margin-left:auto; font-size:11px; padding:3px 10px; border-radius:20px; flex-shrink:0}
  .dot.new{background:var(--bg); color:var(--sub)}
  .dot.learn{background:var(--yellow-soft); color:var(--yellow)}
  .dot.master{background:var(--green-soft); color:var(--green)}
  .count{font-size:12px; color:var(--sub); margin-bottom:10px}
  /* 进度 */
  #prog{display:none; padding:6px 18px 0}
  .prog-card{background:var(--card); border-radius:16px; border:1px solid var(--line);
    padding:18px; margin-bottom:12px}
  .prog-card h3{font-size:15px; margin-bottom:12px}
  .bar{height:10px; background:var(--bg); border-radius:10px; overflow:hidden}
  .bar i{display:block; height:100%; background:var(--green); border-radius:10px; transition:width .3s}
  .prog-row{display:flex; justify-content:space-between; font-size:13px; color:var(--sub); margin-top:8px}
  .danger{
    width:100%; background:#fff; color:var(--red); border:1px solid var(--red);
    border-radius:14px; padding:13px 0; font-size:15px; cursor:pointer; margin-top:8px;
  }
  /* tab */
  nav{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:520px; background:#fff; border-top:1px solid var(--line);
    display:flex; z-index:10;
  }
  nav button{
    flex:1; border:none; background:none; padding:10px 0 12px; font-size:13px;
    color:var(--sub); cursor:pointer;
  }
  nav button.on{color:var(--green); font-weight:700}
  nav button .ic{display:block; font-size:20px; margin-bottom:2px}
.spk{margin-top:8px; background:none; border:1px solid var(--line); color:var(--green); border-radius:20px; padding:5px 14px; font-size:13px; cursor:pointer}
.spk:active{background:var(--green-soft)}
.subrow{display:flex; gap:10px; margin-top:14px; width:100%}
.subrow button{flex:1; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 0; font-size:14px; color:var(--green); cursor:pointer}
.subrow button:active{background:var(--green-soft)}
.q-head{font-size:13px; color:var(--sub); margin:16px 0 10px; text-align:center}
.q-word{font-family:"Kaiti SC","STKaiti","KaiTi",serif; font-size:56px; font-weight:700; text-align:center; margin:24px 0 6px; letter-spacing:4px}
.q-small{font-size:20px; font-family:inherit; color:var(--sub); font-weight:400; letter-spacing:0}
.q-mean{font-size:19px; line-height:1.8; text-align:center; margin:12px 0 20px; background:var(--green-soft); color:#22463b; border-radius:14px; padding:16px}
.q-sub{text-align:center; color:var(--sub); font-size:14px; margin-bottom:16px}
.q-opts{display:flex; flex-direction:column; gap:10px; padding:0 18px}
.q-opt{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; font-size:15px; text-align:left; line-height:1.7; cursor:pointer; color:var(--ink)}
.q-opt:active{background:var(--green-soft); border-color:var(--green)}
.q-char{text-align:center; font-family:"Kaiti SC","STKaiti",serif; font-size:26px; font-weight:700}
.row2{display:flex; gap:10px; margin-top:12px}
.row2 button{flex:1; background:var(--green-soft); color:var(--green); border:none; border-radius:12px; padding:11px 0; font-size:14px; font-weight:600; cursor:pointer}
.backup-ta{display:none; width:100%; min-height:80px; border:1px solid var(--line); border-radius:12px; padding:10px; font-size:12px; margin-top:12px; box-sizing:border-box; font-family:monospace}
.hint2{font-size:12px; color:var(--sub); margin-top:8px; line-height:1.6}
.tagrow{display:flex; gap:8px; margin-bottom:10px}
.tagrow select{flex:1; min-width:0; padding:10px 8px; border-radius:12px; border:1px solid var(--line); background:var(--card); font-size:14px; color:var(--ink); outline:none}
.tagrow button{background:var(--green); color:#fff; border:none; border-radius:12px; padding:0 14px; font-size:14px; font-weight:600; cursor:pointer; flex-shrink:0}
.goal-btns{display:flex; gap:8px}
.goal-btns button{flex:1; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 0; font-size:14px; color:var(--sub); cursor:pointer}
.goal-btns button.on{background:var(--green); border-color:var(--green); color:#fff; font-weight:700}
.week{display:flex; gap:6px; align-items:flex-end; height:70px; padding-top:6px}
.week div{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:4px; height:100%}
.week i{display:block; width:70%; background:var(--green); border-radius:4px 4px 0 0; min-height:3px}
.week span{font-size:10px; color:var(--sub)}
.qnumrow{display:flex; align-items:center; gap:8px; margin:12px 18px 4px}
.qnumrow span{font-size:13px; color:var(--sub)}
.qnumrow button{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:6px 12px; font-size:13px; color:var(--sub); cursor:pointer}
.qnumrow button.on{background:var(--green); border-color:var(--green); color:#fff; font-weight:700}
.q-sent{font-size:17px; line-height:1.9; text-align:center; margin:18px 4px 14px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; color:var(--ink)}
.q-sent .hl{color:var(--red); font-weight:700; border-bottom:2px solid var(--red)}
.q-zi{font-size:17px; text-align:center; letter-spacing:1px}
.q-opt.q-ok{background:var(--green); border-color:var(--green); color:#fff}
.q-opt.q-bad{background:var(--red); border-color:var(--red); color:#fff}
.q-feed{border-radius:14px; padding:14px 16px; margin:14px 18px 0; font-size:15px; line-height:1.8}
.q-feed-ok{background:var(--green-soft); color:#22463b}
.q-feed-bad{background:var(--red-soft); color:#6e2f1f}
.q-feed-ex{font-size:13px; color:var(--sub); margin-top:6px; line-height:1.7}
</style>
</head>
<body>

<header>
  <h1>文言实词<small>初中实词 · 全收录</small></h1>
  <div class="date" id="today"></div>
</header>

<div class="stats">
  <div><b id="sMaster">0</b><span>已掌握</span></div>
  <div><b id="sLearn">0</b><span>学习中</span></div>
  <div><b id="sNew">0</b><span>未开始</span></div>
  <div><b id="sToday">0</b><span>今日已学</span></div>
</div>

<!-- 学习页 -->
<section id="study">
  <div class="card-area">
    <div class="card">
      <span class="tag" id="posTag">第 1 / 1 个</span>
      <div class="word" id="curWord">安</div>
      <div class="py" id="curPy">ān</div>
      <button class="spk" onclick="speak()">🔊 朗读</button>
      <div class="mean" id="curMean"></div>
      <div class="btns" id="gradeBtns">
        <button class="b-no" onclick="grade(0)">不认识</button>
        <button class="b-mid" onclick="grade(1)">模糊</button>
        <button class="b-yes" onclick="grade(2)">认识✓</button>
      </div>
      <button class="btn-flip" id="flipBtn" onclick="flip()">显示答案</button>
    </div>
    <div class="hint" id="hint">点"显示答案"后，凭真实感觉评分哦</div>
    <div class="subrow">
      <button id="wrongBtn" onclick="startWrong()">📕 错词复习（0）</button>
      <button onclick="restart()">🔄 重新开始</button>
    </div>
  </div>
  <div class="done" id="doneBox">
    <div class="big">🎉</div>
    <h2>今日任务完成！</h2>
    <p id="doneText"></p>
    <button onclick="restart()">再学一轮</button>
    <button class="ghost" onclick="switchTab('list')">去词表看看</button>
  </div>
</section>

<!-- 词表页 -->
<section id="list">
  <input class="search" id="searchBox" placeholder="搜索实词，如：安" oninput="renderList()">
  <div class="tagrow">
    <select id="tagFilter" onchange="applyTagFilter()"></select>
    <button onclick="learnFiltered()">📖 背这些词</button>
  </div>
  <div class="count" id="listCount"></div>
  <div id="listWrap"></div>
</section>

<!-- 测验页 -->
<section id="quiz">
  <div class="qnumrow">
    <span>题量</span>
    <button data-q="10" onclick="setQNum(10)">10</button>
    <button data-q="20" onclick="setQNum(20)">20</button>
    <button data-q="30" onclick="setQNum(30)">30</button>
    <button onclick="startQuiz()">🔄 重新出题</button>
  </div>
  <div id="quizBox"></div>
</section>

<!-- 进度页 -->
<section id="prog">
  <div class="prog-card">
    <h3>📈 总进度</h3>
    <div class="bar"><i id="progBar"></i></div>
    <div class="prog-row"><span id="progText"></span></div>
  </div>
  <div class="prog-card">
    <h3>🎯 每日目标</h3>
    <div class="goal-btns">
      <button data-g="10" onclick="setGoal(10)">10个</button>
      <button data-g="20" onclick="setGoal(20)">20个</button>
      <button data-g="30" onclick="setGoal(30)">30个</button>
      <button data-g="50" onclick="setGoal(50)">50个</button>
    </div>
    <div class="bar" style="margin-top:12px"><i id="goalBar"></i></div>
    <div class="prog-row"><span id="goalText"></span></div>
  </div>
  <div class="prog-card">
    <h3>📅 最近 7 天</h3>
    <div class="week" id="weekBox"></div>
  </div>
  <div class="prog-card">
    <h3>🔥 学习记录</h3>
    <div class="prog-row"><span>今日已学</span><b id="mToday">0</b></div>
    <div class="prog-row"><span>连续打卡</span><b id="mStreak">0 天</b></div>
    <div class="prog-row"><span>累计学习</span><b id="mTotal">0 次</b></div>
    <div class="prog-row"><span>测验正确率</span><b id="mQuiz">--</b></div>
  </div>
  <div class="prog-card">
    <h3>💾 进度备份</h3>
    <div class="prog-row"><span>换手机或清浏览器前先备份，导入后进度不丢</span></div>
    <div class="row2">
      <button onclick="exportBackup()">导出备份</button>
      <button onclick="importBackup()">导入备份</button>
    </div>
    <textarea class="backup-ta" id="backupTa" placeholder="点导出后这里会出现备份内容；或把备份内容粘贴到这里再点导入"></textarea>
    <div class="hint2" id="backupHint"></div>
  </div>
  <div class="prog-card">
    <h3>💡 说明</h3>
    <div class="prog-row" style="line-height:1.9">
      <span>
        认识 → 3天后再见<br>
        模糊 → 明天再见<br>
        不认识 → 稍后重来<br>
        连续"认识"3次 = 已掌握<br>
        数据只存在这台手机里
      </span>
    </div>
  </div>
  <button class="danger" onclick="resetAll()">重置全部进度</button>
</section>

<nav>
  <button id="tab-study" class="on" onclick="switchTab('study')"><span class="ic">📖</span>学习</button>
  <button id="tab-list" onclick="switchTab('list')"><span class="ic">📋</span>词表</button>
  <button id="tab-quiz" onclick="switchTab('quiz')"><span class="ic">🎯</span>测验</button>
  <button id="tab-prog" onclick="switchTab('prog')"><span class="ic">📊</span>进度</button>
</nav>

<script>
/* ============ 词表数据（第一批 · 持续补充中） ============ */
var WORDS = [
  {w:"安",py:"ān",y:["①怎么：安求其能千里也（《马说》）","②养：衣食所安（《曹刿论战》）","③安定：安居乐业"]},
  {w:"卑",py:"bēi",y:["①低下：非天质之卑（《送东阳马生序》）","②身份低微：先帝不以臣卑鄙（《出师表》）"]},
  {w:"备",py:"bèi",y:["①周全、详尽：前人之述备矣（《岳阳楼记》）","②具备：一时齐发，众妙毕备（《口技》）","③准备：犹得备晨炊（《石壕吏》）"]},
  {w:"被",py:"bèi",y:["①影响：被于来世","②同\"披\"，穿：皆被绮绣（《送东阳马生序》）"]},

  {w:"毕",py:"bì",y:["①尽：毕力平险（《愚公移山》）","②完全、都：众妙毕备（《口技》）"]},
  {w:"兵",py:"bīng",y:["①兵器：兵革非不坚利也（《得道多助》）","②军队、士兵：可汗大点兵（《木兰诗》）"]},
  {w:"薄",py:"bó",y:["①迫近：薄暮冥冥（《岳阳楼记》）","②轻视：不宜妄自菲薄（《出师表》）"]},
  {w:"曾",py:"céng",y:["①曾经：相逢何必曾相识（《琵琶行》）","②同\"增\"，增加：曾益其所不能（《生于忧患》）"]},
  {w:"尝",py:"cháng",y:["①曾经：尝趋百里外（《送东阳马生序》）","②品尝：尝一脔肉"]},
  {w:"诚",py:"chéng",y:["①诚心：帝感其诚（《愚公移山》）","②确实：此诚危急存亡之秋也（《出师表》）"]},
  {w:"乘",py:"chéng",y:["①坐、驾：公与之乘（《曹刿论战》）","②趁着：乘胜追击"]},
  {w:"从",py:"cóng",y:["①跟随：从先人还家（《伤仲永》）","②跟从、学习：择其善者而从之（《论语》）","③听从：从民欲也（《陈涉世家》）"]},
  {w:"当",py:"dāng",y:["①在、正在：当是时（《口技》）","②应当：当立者乃公子扶苏（《陈涉世家》）","③抵挡：锐不可当"]},
  {w:"道",py:"dào",y:["①道路：会天大雨，道不通（《陈涉世家》）","②道理、方法：以咨诹善道（《出师表》）","③说：不足为外人道也（《桃花源记》）"]},
  {w:"得",py:"dé",y:["①得到：一狼洞其中，意将隧入以攻其后也（《狼》）","②能够：余因得遍观群书（《送东阳马生序》）"]},
  {w:"度",py:"dù",y:["①越过：关山度若飞（《木兰诗》）","②估计：度已失期（《陈涉世家》）"]},
  {w:"端",py:"duān",y:["①头、事物的一头：东坡右手执卷端（《核舟记》）","②端正：其人视端容寂（《核舟记》）"]},

var meta = Object.assign({}, DEF_META);
try { meta = Object.assign({}, DEF_META, JSON.parse(localStorage.getItem(MKEY)) || {}); } catch(e) {}
function pad2(n){ return n < 10 ? "0" + n : "" + n; }
function dstr(d){ return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()); }
function todayStr(){ return dstr(new Date()); }
function saveMeta(){ localStorage.setItem(MKEY, JSON.stringify(meta)); }
function bumpToday(){
  var t = todayStr();
  if (meta.day !== t){
    var y = new Date(); y.setDate(y.getDate() - 1);
    meta.streak = (meta.day === dstr(y)) ? meta.streak + 1 : 1;
    meta.day = t; meta.count = 0;
  }
  meta.count++; meta.total++;
  meta.week[t] = meta.count;
  var old = dstr(new Date(Date.now() - 7*24*3600*1000));
  Object.keys(meta.week).forEach(function(k){ if (k < old) delete meta.week[k]; });
  saveMeta();
}

var queue = [], pos = 0, cur = null, answered = false;

function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }

function dueOf(w){
  var s = state[w];
  if (!s) return 0;                 // 未学，立即学
  if (s.lvl === 2) return Infinity; // 已掌握
  return s.due;
}
function isMaster(w){ return state[w] && state[w].lvl === 2; }

var filteredPool = null;
function buildQueue(onlyWrong){
  if (onlyWrong){
    queue = shuffle(wrongList().slice());
    pos = 0;
    return;
  }
  var pool = filteredPool || WORDS;
  var now = Date.now(), due = [], later = [];
  pool.forEach(function(x){
    var d = dueOf(x.w);
    if (d === 0) due.push(x);
    else if (d <= now) due.push(x);
    else later.push(x);
  });
  shuffle(due);
  var wrongDue = [], otherDue = [];
  due.forEach(function(x){
    var s = state[x.w];
    if (s && s.wrong) wrongDue.push(x); else otherDue.push(x);
  });
  queue = wrongDue.concat(otherDue, later);
  pos = 0;
}

function shuffle(a){
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
}

function day(ms){
  var d = new Date(nowMs() + ms);
  return d;
}
function nowMs(){ return Date.now(); }

function render(){
  var mastered = 0, learning = 0, unseen = 0;
  WORDS.forEach(function(x){
    var s = state[x.w];
    if (!s) unseen++;
    else if (s.lvl === 2) mastered++;
    else learning++;
  });
  document.getElementById("sMaster").textContent = mastered;
  document.getElementById("sLearn").textContent = learning;
  document.getElementById("sNew").textContent = unseen;
  document.getElementById("sToday").textContent = (meta.day === todayStr()) ? meta.count : 0;
  document.getElementById("today").textContent = fmtDate(new Date());
  var wb = document.getElementById("wrongBtn");
  if (wb) wb.textContent = "📕 错词复习（" + wrongList().length + "）";
  renderProg();
}

function fmtDate(d){
  var w = ["日","一","二","三","四","五","六"][d.getDay()];
  return (d.getMonth()+1) + "月" + d.getDate() + "日 周" + w;
}

function showCard(){
  var el = document.getElementById("study");
  var doneBox = document.getElementById("doneBox");
  if (pos >= queue.length){
    doneBox.style.display = "block";
    document.querySelector(".card-area").style.display = "none";
    var m = 0, l = 0;
    WORDS.forEach(function(x){
      var s = state[x.w];
      if (s && s.lvl === 2) m++; else if (s) l++;
    });
    document.getElementById("doneText").textContent =
      "本轮完成！已掌握 " + m + " 个，学习中 " + l + " 个。明天再来复习吧～";
    return;
  }
  doneBox.style.display = "none";
  document.querySelector(".card-area").style.display = "flex";
  cur = queue[pos];
  answered = false;
  document.getElementById("curWord").textContent = cur.w;
  document.getElementById("curPy").textContent = cur.py;
  document.getElementById("curMean").style.display = "none";
  document.getElementById("gradeBtns").style.display = "none";
  document.getElementById("flipBtn").style.display = "block";
  document.getElementById("posTag").textContent = "第 " + (pos+1) + " / " + queue.length + " 个";
  var h = document.getElementById("hint");
  if (wrongMode) h.textContent = "错词复习中 · 点\"显示答案\"，把错词彻底干掉";
  else h.textContent = isMaster(cur.w) ? "复习巩固 · 点\"显示答案\"看看还记得不" : "点\"显示答案\"，凭真实感觉评分哦";
  document.getElementById("curMean").innerHTML = "";
}

function flip(){
  if (!cur) return;
  document.getElementById("curMean").innerHTML = cur.y.map(function(s){
    return "<p>" + s.replace(/^(①|②|③|④|⑤)/, "<b>$1</b>") + "</p>";
  }).join("");
  document.getElementById("curMean").style.display = "block";
  document.getElementById("gradeBtns").style.display = "flex";
  document.getElementById("flipBtn").style.display = "none";
  answered = true;
}

function grade(g){
  if (!cur || !answered) return;
  var w = cur.w, now = Date.now(), s = state[w] || {n:0, lvl:0, due:0, wrong:false};
  if (g === 0){            // 不认识：1分钟后重来
    s.n = 0; s.lvl = 0; s.due = now + 60*1000; s.wrong = true;
  } else if (g === 1){     // 模糊：明天
    s.n = 0; s.lvl = 0; s.due = now + 24*3600*1000; s.wrong = true;
  } else {                 // 认识：1天→3天→7天，3次掌握
    s.n = (s.n || 0) + 1;
    if (s.n >= 3){ s.lvl = 2; s.due = Infinity; delete s.wrong; }
    else {
      var iv = [1,3,7][s.n - 1] || 7;
      s.due = now + iv*24*3600*1000;
    }
  }
  state[w] = s;
  save();
  bumpToday();
  pos++;
  render();
  showCard();
}

function restart(){ buildQueue(); showCard(); }

/* ============ 词表页 ============ */
function renderList(){
  var q = document.getElementById("searchBox").value.trim();
  var tag = document.getElementById("tagFilter") ? document.getElementById("tagFilter").value : "";
  var wrap = document.getElementById("listWrap");
  var shown = WORDS.filter(function(x){
    if (q && x.w.indexOf(q) < 0 && x.py.indexOf(q) < 0) return false;
    if (tag && x.tag !== tag) return false;
    return true;
  });
  document.getElementById("listCount").textContent = "共 " + shown.length + " 个（词表已收录 " + WORDS.length + " 个实词）";
  wrap.innerHTML = "";
  shown.forEach(function(x){
    var s = state[x.w];
    var cls = !s ? "new" : (s.lvl === 2 ? "master" : "learn");
    var label = !s ? "未学" : (s.lvl === 2 ? "已掌握" : "学习中");
    var d = document.createElement("div");
    d.className = "w-item";
    d.innerHTML =
      '<div class="top"><span class="w">' + x.w + '</span><span class="py">' + x.py +
      '</span><span class="dot ' + cls + '">' + label + '</span></div>' +
      '<div class="first">' + x.y[0] + '</div>' +
      '<div class="detail">' + x.y.map(function(s2){
        return "<p>" + s2.replace(/^(①|②|③|④|⑤)/, "<b>$1</b>") + "</p>";
      }).join("") + '</div>';
    d.querySelector(".top").onclick = function(){ toggleDetail(d); };
    d.querySelector(".first").onclick = function(){ toggleDetail(d); };
    wrap.appendChild(d);
  });
}
function toggleDetail(d){
  var dt = d.querySelector(".detail");
  dt.style.display = dt.style.display === "block" ? "none" : "block";
}

/* ============ 进度页 ============ */
function renderProg(){
  var m = 0;
  WORDS.forEach(function(x){ if (state[x.w] && state[x.w].lvl === 2) m++; });
  var pct = Math.round(m / WORDS.length * 100);
  document.getElementById("progBar").style.width = pct + "%";
  document.getElementById("progText").textContent =
    "已掌握 " + m + " / " + WORDS.length + " 个（" + pct + "%）";
  document.getElementById("mToday").textContent = (meta.day === todayStr()) ? meta.count : 0;
  document.getElementById("mStreak").textContent = meta.streak + " 天";
  document.getElementById("mTotal").textContent = meta.total + " 次";
  var mq = document.getElementById("mQuiz");
  if (mq) mq.textContent = meta.quizT ? Math.round(meta.quizR / meta.quizT * 100) + "%" : "--";
  var goal = meta.goal || 20;
  var todayC = (meta.day === todayStr()) ? meta.count : 0;
  var gp = Math.min(100, Math.round(todayC / goal * 100));
  var gbar = document.getElementById("goalBar");
  if (gbar) gbar.style.width = gp + "%";
  var gt = document.getElementById("goalText");
  if (gt) gt.textContent = "今日 " + todayC + " / 目标 " + goal + " 个（" + gp + "%）";
  var gbs = document.querySelectorAll(".goal-btns button");
  for (var gi = 0; gi < gbs.length; gi++){
    gbs[gi].className = parseInt(gbs[gi].getAttribute("data-g"), 10) === goal ? "on" : "";
  }
  renderWeek();
}
function resetAll(){
  if (confirm("确定清空全部学习进度？")){
    localStorage.removeItem(KEY);
    localStorage.removeItem(MKEY);
    state = {};
    meta = {day:"", count:0, streak:0, total:0};
    saveMeta();
    buildQueue();
    render();
    showCard();
    renderList();
  }
}

/* ============ 按课文分组 ============ */
WORDS.forEach(function(x){
  var m = x.y.join("").match(/《([^》]+)》/);
  x.tag = m ? m[1] : "其他";
});
function populateTagFilter(){
  var sel = document.getElementById("tagFilter");
  if (!sel) return;
  var count = {};
  WORDS.forEach(function(x){ count[x.tag] = (count[x.tag] || 0) + 1; });
  var tags = Object.keys(count).sort(function(a, b){ return count[b] - count[a]; });
  var html = '<option value="">全部（' + WORDS.length + '）</option>';
  tags.forEach(function(t){
    html += '<option value="' + t + '">' + t + '（' + count[t] + '）</option>';
  });
  sel.innerHTML = html;
}
function applyTagFilter(){ renderList(); }
function learnFiltered(){
  var tag = document.getElementById("tagFilter").value;
  filteredPool = tag ? WORDS.filter(function(x){ return x.tag === tag; }) : null;
  if (filteredPool && !filteredPool.length) filteredPool = null;
  switchTab("study");
  buildQueue();
  showCard();
  document.getElementById("hint").textContent =
    filteredPool ? "正在背：《" + tag + "》专属 " + filteredPool.length + " 个词" : "全部词表复习";
}

/* ============ 每日目标 ============ */
function setGoal(n){
  meta.goal = n;
  saveMeta();
  renderProg();
}

/* ============ 最近7天 ============ */
function renderWeek(){
  var box = document.getElementById("weekBox");
  if (!box) return;
  var days = [], vals = [];
  for (var i = 6; i >= 0; i--){
    var d = new Date(); d.setDate(d.getDate() - i);
    var k = dstr(d);
    days.push(k);
    vals.push(meta.week[k] || 0);
  }
  var max = Math.max.apply(null, vals.concat([1]));
  var wd = ["日","一","二","三","四","五","六"];
  var html = "";
  days.forEach(function(k, idx){
    var d = new Date(k + "T00:00:00");
    var h = Math.round(vals[idx] / max * 42);
    html += '<div><i style="height:' + Math.max(3, h) + 'px"></i><span>' + wd[d.getDay()] + '</span></div>';
  });
  box.innerHTML = html;
}

function setQNum(n){

  saveMeta();

function startQuiz(){
  quiz.q = makeQuestions(meta.qnum || 10);
  quiz.i = 0; quiz.right = 0; quiz.wrong = []; quiz.picked = false; quiz.counted = false;
  renderQuiz();
}
function parseExample(yi){
  var t = yi.replace(/^[①②③④⑤⑥]/, "");
  var p = t.indexOf("：");
  if (p < 0) return null;
  var mean = t.slice(0, p);
  var ex = t.slice(p + 1).replace(/（[^）]*）$/, "").replace(/[。！？]$/, "");
  if (!ex) return null;
  return {mean:mean, ex:ex};
}
function pickDistractor(pool, exclude, n, getText){
  var out = [], guard = 0;
  while (out.length < n && guard < 300){
    guard++;
    var it = pool[Math.floor(Math.random() * pool.length)];
    var txt = getText(it);
    if (txt && txt !== exclude && out.indexOf(txt) < 0) out.push(txt);
  }
  return out;
}
function makeQuestions(n){
  var pool = WORDS.slice();
  shuffle(pool);
  var qs = [];
  var zix = ZIXING.slice();
  shuffle(zix);
  var yin = YIN.slice();
  shuffle(yin);
  var nFixed = Math.min(zix.length, Math.max(1, Math.round(n / 5))) + Math.min(yin.length, Math.max(1, Math.round(n / 5)));
  var k;
  for (k = 0; k < Math.min(zix.length, Math.max(1, Math.round(n / 5))); k++){
    var pair = zix[k];
    var rightOpts = [pair[0]];
    var guardz = 0;
    while (rightOpts.length < 3 && guardz < 120){
      guardz++;
      var other = zix[Math.floor(Math.random() * zix.length)];
      if (rightOpts.indexOf(other[0]) < 0) rightOpts.push(other[0]);
    }
    shuffle(rightOpts);
    qs.push({type:4, prompt:"下列词语中，有错别字的一项是", opts:rightOpts.concat([pair[1]]), ans:3, word:pair[1], right:pair[0], py:""});
  }
  for (k = 0; k < Math.min(yin.length, Math.max(1, Math.round(n / 5))); k++){
    var it = yin[k];
    var optsY = [it[1]];
    var guardy = 0;
    while (optsY.length < 4 && guardy < 150){
      guardy++;
      var oy = yin[Math.floor(Math.random() * yin.length)];
      var cand = Math.random() < 0.5 ? oy[1] : oy[2];
      if (cand && optsY.indexOf(cand) < 0) optsY.push(cand);
    }
    shuffle(optsY);
    qs.push({type:5, word:it[0], py:"", prompt:"选出「" + it[0] + "」的正确读音", opts:optsY, ans:optsY.indexOf(it[1])});
  }
  var guard2 = 0;
  while (qs.length < n && guard2 < 400){
    guard2++;
    var w = pool[Math.floor(Math.random() * pool.length)];
    var t = Math.floor(Math.random() * 4);
    if (t === 0){
      var correct = w.y[0];
      var opts = [correct].concat(pickDistractor(pool, correct, 3, function(x){ return x.y[0]; }));
      shuffle(opts);
      qs.push({type:0, word:w.w, py:w.py, prompt:"选出「" + w.w + "」的正确释义", opts:opts, ans:opts.indexOf(correct)});
    } else if (t === 1){
      var correct2 = w.w;
      var opts2 = [correct2].concat(pickDistractor(pool, correct2, 3, function(x){ return x.w; }));
      shuffle(opts2);
      qs.push({type:1, word:w.w, py:w.py, prompt:w.y[0], opts:opts2, ans:opts2.indexOf(correct2)});
    } else if (t === 2){
      var cand = null;
      for (var j = 0; j < w.y.length; j++){
        var pe = parseExample(w.y[j]);
        if (pe){ cand = {w:w, pe:pe}; break; }
      }
      if (!cand) continue;
      var correct3 = cand.pe.mean;
      var opts3 = [correct3].concat(pickDistractor(pool, correct3, 3, function(x){ return x.y[0].replace(/^[①②③④⑤⑥]/, "").split("：")[0]; }));
      shuffle(opts3);
      qs.push({type:2, word:w.w, py:w.py, prompt:cand.pe.ex, opts:opts3, ans:opts3.indexOf(correct3)});
    } else {
      var opts4 = [w.py].concat(pickDistractor(pool, w.py, 3, function(x){ return x.py; }));
      shuffle(opts4);
      qs.push({type:3, word:w.w, py:w.py, prompt:"选出「" + w.w + "」的正确读音", opts:opts4, ans:opts4.indexOf(w.py)});
    }
  }
  return qs;
}
function answerText(q){
  if (q.type === 4) return q.opts[q.ans] + "（正确写法：" + q.right + "）";
  return q.opts[q.ans];
}
function explainText(q){
  if (q.type === 4) return "";
  if (q.type === 5) return "";
  var w = null;
  for (var i = 0; i < WORDS.length; i++){
    if (WORDS[i].w === q.word){ w = WORDS[i]; break; }
  }
  if (!w) return "";
  if (q.type === 2) return q.prompt;
  return w.y[0];
}
function renderQuiz(){
  var box = document.getElementById("quizBox");
  var qr = document.querySelectorAll(".qnumrow button[data-q]");
  for (var qi = 0; qi < qr.length; qi++){
    qr[qi].className = parseInt(qr[qi].getAttribute("data-q"), 10) === (meta.qnum || 10) ? "on" : "";
  }
  if (!quiz.q){ startQuiz(); return; }
  if (quiz.i >= quiz.q.length){
    if (!quiz.counted){
      quiz.counted = true;
      meta.quizT = (meta.quizT || 0) + quiz.q.length;
      meta.quizR = (meta.quizR || 0) + quiz.right;
      saveMeta();
      renderProg();
    }
    var wl = quiz.wrong;
    var html = '<div class="done" style="display:block">' +
      '<div class="big">' + (quiz.right >= Math.ceil(quiz.q.length * 0.8) ? "🏆" : "📖") + '</div>' +
      '<h2>答对 ' + quiz.right + ' / ' + quiz.q.length + '</h2>' +
      (wl.length
        ? '<p>实词题错了 ' + wl.length + ' 个，已自动收进错词本：' + wl.join("、") + '</p>'
        : '<p>全对！稳得很，继续保持～</p>') +
      '<button onclick="startQuiz()">再来一轮</button>' +
      (wl.length ? '<button class="ghost" onclick="switchTab(\'study\');startWrong()">去背错词</button>' : '') +
      '</div>';
    box.innerHTML = html;
    return;
  }
  var q = quiz.q[quiz.i];
  var head;
  if (q.type === 0){
    head = '<div class="q-word">' + q.word + '</div><div class="q-sub">' + q.py + ' · 选出正确释义</div>';
  } else if (q.type === 1){
    head = '<div class="q-mean">' + q.prompt + '</div><div class="q-sub">选出对应的实词</div>';
  } else if (q.type === 2){
    head = '<div class="q-sent">' + q.prompt.replace(q.word, '<b class="hl">' + q.word + '</b>') + '</div><div class="q-sub">句中「' + q.word + '」的意思是？</div>';
  } else if (q.type === 3){
    head = '<div class="q-word">' + q.word + '</div><div class="q-sub">选出正确读音</div>';
  } else if (q.type === 5){
    head = '<div class="q-word">' + q.word + '</div><div class="q-sub">选出正确读音</div>';
  } else {
    head = '<div class="q-sub" style="margin-top:24px">' + q.prompt + '</div>';
  }
  var opts = "";
  for (var i = 0; i < q.opts.length; i++){
    var cls = "q-opt";
    if (q.type === 1 || q.type === 3 || q.type === 5) cls += " q-char";
    if (q.type === 4) cls += " q-zi";
    if (quiz.picked){
      if (i === q.ans) cls += " q-ok";
      else if (i === quiz.pick) cls += " q-bad";
    }
    opts += '<button class="' + cls + '" onclick="quizPick(' + i + ')">' + q.opts[i] + '</button>';
  }
  var feed = "";
  if (quiz.picked){
    var ok = quiz.pick === q.ans;
    var ex = explainText(q);
    feed = '<div class="q-feed ' + (ok ? 'q-feed-ok' : 'q-feed-bad') + '">' +
      (ok ? '✅ 答对了！' : '❌ 答错了，正确答案：' + answerText(q)) +
      (ex ? '<div class="q-feed-ex">' + ex + '</div>' : '') +
      '</div>' +
      '<button class="btn-flip" onclick="nextQ()">' + (quiz.i + 1 >= quiz.q.length ? '查看结果' : '下一题 →') + '</button>';
  }
  box.innerHTML =
    '<div class="q-head">第 ' + (quiz.i+1) + ' / ' + quiz.q.length + ' 题 · 已答对 ' + quiz.right + '</div>' +
    head + '<div class="q-opts">' + opts + '</div>' + feed;
}
function quizPick(idx){
  if (!quiz.q || quiz.picked) return;
  quiz.pick = idx;
  quiz.picked = true;
  var q = quiz.q[quiz.i];
  if (idx === q.ans){ quiz.right++; }
  else {
    if (q.type === 0 || q.type === 1 || q.type === 2){
      quiz.wrong.push(q.word);
      var s = state[q.word] || {n:0, lvl:0, due:0, wrong:false};
      s.wrong = true;
      state[q.word] = s;
      save();
    }
  }
  renderQuiz();
}
function nextQ(){
  quiz.pick = null;
  quiz.picked = false;
  quiz.i++;
  renderQuiz();
}

/* ============ 备份 ============ */
function exportBackup(){
  var data = {v:1, state:state, meta:meta};
  var ta = document.getElementById("backupTa");
  ta.value = JSON.stringify(data);
  ta.style.display = "block";
  ta.select();
  try { document.execCommand("copy"); } catch(e){}
  try {
    var blob = new Blob([ta.value], {type:"text/plain"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "文言实词进度备份.txt";
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ document.body.removeChild(a); }, 200);
  } catch(e){}
  document.getElementById("backupHint").textContent = "已复制到剪贴板；若自动下载了文件，保存好即可";
}
function importBackup(){
  var ta = document.getElementById("backupTa");
  var hint = document.getElementById("backupHint");
  try {
    var data = JSON.parse(ta.value);
    if (!data || !data.state) throw new Error("bad");
    state = data.state || {};
    meta = data.meta || meta;
    save();
    saveMeta();
    buildQueue();
    render();
    showCard();
    renderList();
    renderProg();
    hint.textContent = "导入成功！进度已恢复";
  } catch(e){
    hint.textContent = "导入失败：不是有效的备份内容";
  }
}

/* ============ 页面切换 ============ */
function switchTab(t){
  ["study","list","quiz","prog"].forEach(function(x){
    document.getElementById(x).style.display = x === t ? "block" : "none";
    document.getElementById("tab-" + x).className = x === t ? "on" : "";
  });
  if (t === "list") renderList();
  if (t === "prog") renderProg();
  if (t === "study") showCard();
  if (t === "quiz") renderQuiz();
}

/* ============ 启动 ============ */
populateTagFilter();
render();
buildQueue();
showCard();
renderList();

/* ============ PWA（离线 + 添加到主屏幕） ============ */
if ("serviceWorker" in navigator && location.protocol === "https:"){
  navigator.serviceWorker.register("sw.js").catch(function(){});
}
